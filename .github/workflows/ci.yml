name: Rust
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.89.0
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Linux window dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libx11-dev libxcursor-dev libxi-dev libxrandr-dev libxkbcommon-dev libudev-dev
      - run: cargo fmt --all --check
      - run: cargo test --locked
      - run: cargo check --locked -p empire-client
      - run: cargo run --locked -p empire-tools -- simulate 300 2 determinism.empire-replay
      - run: cargo run --locked -p empire-tools -- replay determinism.empire-replay
      - uses: actions/upload-artifact@v4
        with:
          name: replay-${{ matrix.os }}
          path: determinism.empire-replay
      - run: python scripts/test_tools.py
  compare-determinism:
    needs: test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: replay-*
          path: replays
      - name: Compare platform state hashes
        run: |
          python - <<'PY'
          import json, pathlib
          files = list(pathlib.Path('replays').glob('*/determinism.empire-replay'))
          assert len(files) == 3, f'Expected three platform replays, got {len(files)}'
          hashes = {json.loads(p.read_text())['final_hash'] for p in files}
          assert len(hashes) == 1, f'Cross-platform desynchronization: {hashes}'
          print('All three platform simulations agree:', next(iter(hashes)))
          PY
